<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronomètre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chrono-card">

        <!-- AFFICHAGE CHRONOMÈTRE -->
        <div class="display" aria-label="Chronomètre">
            00:00:00<span class="milli">.00</span>
        </div>

        <!-- BOUTONS (visuels uniquement, pas de fonction) -->
        <div class="controls">
            <button class="btn-start">Démarrer</button>
            <button class="btn-stop">Arrêter</button>
            <button class="btn-reset">Réinitialiser</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
